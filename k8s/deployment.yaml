apiVersion: apps/v1
kind: Deployment
metadata:
  name: demo-web
  namespace: devops-demo
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels: {app: demo-web}
  template:
    metadata:
      labels: {app: demo-web}
    spec:
      containers:
      - name: demo-web
        image: 21520623/devops-demo-web:latest
        imagePullPolicy: Always
        ports: [{name: http, containerPort: 8080}]
        env:
        - {name: APP_VERSION, value: "k8s"}
        - {name: APP_MESSAGE, value: "Hello from DevOps case study - 17-10-2026"}
        readinessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 3, periodSeconds: 5}
        livenessProbe: {httpGet: {path: /health, port: http}, initialDelaySeconds: 10, periodSeconds: 10}
        resources:
          requests: {cpu: 100m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
        securityContext:
          allowPrivilegeEscalation: false
          runAsNonRoot: true
          runAsUser: 10001
          readOnlyRootFilesystem: true
          capabilities: {drop: ["ALL"]}
