services:
  # Jenkins controller — bound to 127.0.0.1 only.
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    ports:
      - "127.0.0.1:8080:8080"
      - "127.0.0.1:50000:50000"
    volumes:
      - jenkins_home:/var/jenkins_home
      # Read-only repo access for Multibranch indexing and Jenkinsfile loading.
      - .:/repo-src:ro
    restart: unless-stopped
    profiles: ["jenkins"]   # not started by plain `docker compose up`
    networks: [default]
  # Build agent with Docker CLI, kubectl, kind, Python and Git.
  # The Docker socket grants effective root-level access to the host.
  # Run trusted pipelines only; the controller does not mount this socket.
  jenkins-agent:
    build:
      context: .
      dockerfile: jenkins-agent.Dockerfile
      args:
        # Match the Docker group ID on the host.
        DOCKER_GID: "990"
    image: devops-case-study-jenkins-agent:latest
    depends_on:
      jenkins:
        condition: service_started
    environment:
      JENKINS_URL: http://jenkins:8080
      JENKINS_NAME: linux-docker-agent
      JENKINS_AGENT_NAME: linux-docker-agent
      # Pass the agent secret at runtime, never commit it.
      JENKINS_SECRET: ${JENKINS_AGENT_SECRET:-}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - jenkins-agent-workspace:/home/jenkins/agent
      # Read-only source access for local CI verification.
      - .:/repo-src:ro
    restart: unless-stopped
    profiles: ["jenkins"]
    networks: [default, kind]
  app:
    build: .
    image: devops-demo-web:local
    ports: ["8081:8080"]
    environment:
      APP_VERSION: local
      APP_MESSAGE: Hello from Docker Compose
    restart: unless-stopped
    networks: [default]
volumes:
  jenkins_home:
  jenkins-agent-workspace:
networks:
  default:
  kind:
    external: true
