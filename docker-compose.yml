services:
  jenkins:
    image: jenkins/jenkins:lts-jdk17
    ports: ["8080:8080","50000:50000"]
    volumes: [jenkins_home:/var/jenkins_home]
    restart: unless-stopped
  app:
    build: .
    image: devops-demo-web:local
    ports: ["8081:8080"]
    environment:
      APP_VERSION: local
      APP_MESSAGE: Hello from Docker Compose
    restart: unless-stopped
volumes:
  jenkins_home:
